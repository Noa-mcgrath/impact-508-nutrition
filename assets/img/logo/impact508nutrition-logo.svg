<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-labelledby="title description">
  <title id="title">Impact508Nutrition logo</title>
  <desc id="description">A turquoise circular logo reading Impact508Nutrition.</desc>
  
  <defs>
    <linearGradient id="fadingLineGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8ECFD1;stop-opacity:0" />
      <stop offset="10%" style="stop-color:#8ECFD1;stop-opacity:1" />
      <stop offset="90%" style="stop-color:#8ECFD1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8ECFD1;stop-opacity:0" />
    </linearGradient>
  </defs>
  
  <circle cx="400" cy="400" r="395" fill="#ffffff"/>
  <circle cx="400" cy="400" r="376" fill="none" stroke="#67bec0" stroke-width="38"/>
  
  <!-- Top Left Corner Accent -->
  <line x1="150" y1="80" x2="150" y2="140" stroke="#67bec0" stroke-width="3" stroke-linecap="round"/>
  <line x1="150" y1="80" x2="210" y2="80" stroke="#67bec0" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Top Right Corner Accent -->
  <line x1="650" y1="80" x2="650" y2="140" stroke="#67bec0" stroke-width="3" stroke-linecap="round"/>
  <line x1="650" y1="80" x2="590" y2="80" stroke="#67bec0" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Bottom Left Corner Accent -->
  <line x1="150" y1="720" x2="150" y2="660" stroke="#67bec0" stroke-width="3" stroke-linecap="round"/>
  <line x1="150" y1="720" x2="210" y2="720" stroke="#67bec0" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Bottom Right Corner Accent -->
  <line x1="650" y1="720" x2="650" y2="660" stroke="#67bec0" stroke-width="3" stroke-linecap="round"/>
  <line x1="650" y1="720" x2="590" y2="720" stroke="#67bec0" stroke-width="3" stroke-linecap="round"/>
  
  <text x="400" y="390"
        fill="#67bec0"
        font-family="Arial, Helvetica, sans-serif"
        font-size="148"
        font-weight="700"
        text-anchor="middle"
        textLength="620"
        lengthAdjust="spacingAndGlyphs">IMPACT508</text>
  <rect x="50" y="424" width="700" height="4" fill="url(#fadingLineGradient)"/>
  <text x="400" y="515"
        fill="#67bec0"
        font-family="Arial, Helvetica, sans-serif"
        font-size="88"
        font-weight="400"
        text-anchor="middle"
        textLength="570"
        lengthAdjust="spacingAndGlyphs">NUTRITION</text>
</svg>
